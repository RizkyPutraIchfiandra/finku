<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #F7F3E8;
    --ink: #121110;
    --yellow: #FFD600;
    --pink: #FF5DA2;
    --green: #4ECB71;
  }

  html, body { width: 1280px; height: 720px; overflow: hidden; }

  body {
    background: var(--cream);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    position: relative;
  }

  /* Grid paper texture, the one flourish that keeps the cream from reading flat. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(18,17,16,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(18,17,16,.055) 1px, transparent 1px);
    background-size: 34px 34px;
  }

  .blob {
    position: absolute;
    border: 3px solid var(--ink);
    border-radius: 999px;
  }
  .blob.a { width: 300px; height: 300px; background: var(--yellow); left: -185px; top: -150px; }
  .blob.b { width: 230px; height: 230px; background: var(--pink); right: -105px; bottom: -120px; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 430px 1fr;
    align-items: center;
    padding: 0 60px;
    gap: 20px;
  }

  /* ---- copy ---- */
  .eyebrow {
    display: inline-block;
    background: var(--ink);
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    padding: 7px 14px;
    margin-bottom: 26px;
  }

  h1 {
    font-family: "Arial Black", "Segoe UI Black", sans-serif;
    font-size: 104px;
    line-height: .86;
    letter-spacing: -.055em;
    margin-bottom: 20px;
  }
  h1 em {
    font-style: normal;
    position: relative;
    /* Behind-the-text highlight: a box-shadow ring would overlap the lede. */
    background: linear-gradient(var(--yellow), var(--yellow)) no-repeat;
    background-size: 100% 72%;
    background-position: 0 42%;
    padding: 0 4px;
  }

  p.lede {
    font-size: 19px;
    line-height: 1.5;
    max-width: 370px;
    margin-bottom: 30px;
    color: #3a3733;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 10px; max-width: 390px; }
  .tag {
    border: 3px solid var(--ink);
    background: #fff;
    box-shadow: 4px 4px 0 var(--ink);
    font-size: 14px;
    font-weight: 700;
    padding: 8px 13px;
  }
  .tag.y { background: var(--yellow); }
  .tag.p { background: var(--pink); }
  .tag.g { background: var(--green); }

  /* ---- phones ---- */
  .phones {
    position: relative;
    height: 100%;
    perspective: 1800px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    position: absolute;
    width: 268px;
    height: 556px;
    border: 5px solid var(--ink);
    border-radius: 38px;
    background: #fff;
    overflow: hidden;
    box-shadow: 16px 18px 0 rgba(18,17,16,.92);
  }
  .phone img {
    width: 100%;
    display: block;
    /* Top-anchored so the header and hero card always survive the crop. */
    object-fit: cover;
    object-position: top center;
    height: 100%;
  }
  /* Notch */
  .phone::after {
    content: "";
    position: absolute;
    top: 13px; left: 50%;
    transform: translateX(-50%);
    width: 86px; height: 7px;
    background: var(--ink);
    border-radius: 99px;
  }

  .phone.left {
    transform: translateX(-250px) translateY(14px) rotateY(23deg) rotateZ(-7deg) scale(.9);
    z-index: 1;
  }
  .phone.center {
    transform: translateY(-16px) rotateZ(-1.5deg) scale(1.06);
    z-index: 3;
  }
  /* Center phone is screenshotted tight to its header, so pad past the notch. */
  .phone.center img { padding-top: 26px; background: var(--cream); }
  .phone.right {
    transform: translateX(250px) translateY(22px) rotateY(-23deg) rotateZ(7deg) scale(.9);
    z-index: 2;
  }

  .caption {
    position: absolute;
    bottom: 26px;
    left: 60px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6b665f;
  }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="stage">
    <div class="copy">
      <span class="eyebrow">Your campus wallet</span>
      <h1>Fin<em>ku</em></h1>
      <p class="lede">
        Jajan tracker yang ngitungin uangmu tiap hari. Atur budget bulanan,
        catat hutang per transaksi, lihat ke mana uangnya pergi.
      </p>
      <div class="tags">
        <span class="tag y">Budget harian</span>
        <span class="tag p">Daftar hutang</span>
        <span class="tag g">Insights</span>
        <span class="tag">Expo &middot; React Native</span>
        <span class="tag">Supabase</span>
      </div>
    </div>

    <div class="phones">
      <div class="phone left"><img src="shot-categories-c.jpg" alt="Halaman kategori Finku" /></div>
      <div class="phone center"><img src="shot-home-c.jpg" alt="Beranda Finku" /></div>
      <div class="phone right"><img src="shot-insights-c.jpg" alt="Halaman insights Finku" /></div>
    </div>
  </div>

  <div class="caption">Finku &mdash; 2026</div>
</body>
</html>
